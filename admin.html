<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>LTX Store — Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0f1115;
    color:#fff;
}

button,
select,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:400px;
    background:#191c23;
    border:1px solid #30343d;
    border-radius:18px;
    padding:30px;
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.logoTitle{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:5px;
}

.loginSubtitle{
    text-align:center;
    color:#9da3ae;
    margin-bottom:25px;
}

.inputGroup{
    margin-bottom:15px;
}

.inputGroup label{
    display:block;
    margin-bottom:7px;
    color:#cbd0d8;
    font-size:14px;
}

.inputGroup input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #343944;
    background:#101218;
    color:#fff;
    outline:none;
}

.inputGroup input:focus{
    border-color:#7c3aed;
}

.primaryBtn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:10px;
    background:#7c3aed;
    color:white;
    font-weight:700;
}

.primaryBtn:hover{
    opacity:.9;
}

#errorMessage{
    color:#ff6b6b;
    text-align:center;
    margin-top:15px;
}


/* ================= ADMIN ================= */

#adminPanel{
    min-height:100vh;
}

header{
    padding:18px 22px;
    background:#17191f;
    border-bottom:1px solid #292d35;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.headerTitle{
    font-size:24px;
    font-weight:800;
}

.headerSub{
    color:#9298a4;
    font-size:13px;
    margin-top:3px;
}

.logoutBtn{
    background:#272b33;
    color:#fff;
    border:1px solid #3b404a;
    padding:10px 14px;
    border-radius:9px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:22px;
}


/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:25px;
}

.stat{
    background:#191c23;
    border:1px solid #2b2f37;
    border-radius:14px;
    padding:18px;
}

.statTitle{
    color:#969ca7;
    font-size:13px;
}

.statNumber{
    font-size:28px;
    font-weight:800;
    margin-top:6px;
}


/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.toolbar input{
    flex:1;
    min-width:220px;
    background:#191c23;
    color:white;
    border:1px solid #30343d;
    padding:12px;
    border-radius:10px;
}

.actionBtn{
    border:1px solid #363b45;
    background:#191c23;
    color:#fff;
    padding:11px 15px;
    border-radius:10px;
}

.actionBtn:hover{
    background:#242831;
}


/* ================= ORDERS ================= */

.orders{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.orderCard{
    background:#191c23;
    border:1px solid #2d3139;
    border-radius:16px;
    padding:18px;
}

.orderTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:15px;
}

.orderNumber{
    font-size:18px;
    font-weight:800;
}

.orderDate{
    color:#8f96a2;
    font-size:12px;
    margin-top:4px;
}


/* ================= STATUS ================= */

.statusBadge{
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.pending{
    background:#6b4b00;
    color:#ffd76a;
}

.packaging{
    background:#123f66;
    color:#69b9ff;
}

.ontheway{
    background:#641f27;
    color:#ff818c;
}

.delivered{
    background:#e9e9e9;
    color:#111;
}


/* ================= CUSTOMER ================= */

.customerInfo{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
}

.infoBox{
    background:#111319;
    border-radius:10px;
    padding:12px;
}

.infoLabel{
    color:#858c98;
    font-size:11px;
    margin-bottom:4px;
}

.infoValue{
    word-break:break-word;
}


/* ================= ITEMS ================= */

.orderItems{
    background:#111319;
    border-radius:10px;
    padding:13px;
    margin-bottom:15px;
}

.itemRow{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #252932;
}

.itemRow:last-child{
    border-bottom:0;
}

.itemName{
    font-weight:600;
}

.itemMeta{
    color:#a7adb8;
    font-size:13px;
    margin-top:3px;
}


/* ================= BOTTOM ================= */

.orderBottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.total{
    font-size:20px;
    font-weight:800;
}

.statusSelect{
    background:#111319;
    color:#fff;
    border:1px solid #363b45;
    padding:10px;
    border-radius:9px;
}

.slipBtn{
    background:#fff;
    color:#111;
    border:0;
    padding:10px 15px;
    border-radius:9px;
    font-weight:700;
}

.slipBtn:hover{
    opacity:.9;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#858c98;
}


/* ================= ERROR ================= */

.dbError{
    color:#ff8585;
    line-height:1.5;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .customerInfo{
        grid-template-columns:1fr;
    }

    header{
        align-items:flex-start;
    }

    .orderTop{
        flex-direction:column;
    }

    .orderBottom{
        align-items:stretch;
    }

    .statusSelect,
    .slipBtn{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
     ===================================================== -->

<section id="loginScreen">

    <div class="loginBox">

        <div class="logoTitle">
            LTX STORE
        </div>

        <div class="loginSubtitle">
            Admin Panel
        </div>


        <form id="loginForm">

            <div class="inputGroup">

                <label>
                    Email
                </label>

                <input
                    id="adminEmail"
                    type="email"
                    autocomplete="username"
                    required
                    placeholder="Admin email">

            </div>


            <div class="inputGroup">

                <label>
                    Password
                </label>

                <input
                    id="adminPassword"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="Password">

            </div>


            <button
                class="primaryBtn"
                type="submit">

                Login to Admin

            </button>


            <div id="errorMessage"></div>

        </form>

    </div>

</section>



<!-- =====================================================
     ADMIN
     ===================================================== -->

<section
    id="adminPanel"
    class="hidden">


<header>

    <div>

        <div class="headerTitle">
            LTX STORE — ADMIN
        </div>

        <div class="headerSub">
            Customer Orders & Status
        </div>

    </div>


    <button
        id="logoutBtn"
        class="logoutBtn">

        Logout

    </button>

</header>



<div class="container">


    <!-- ================= STATS ================= -->

    <div class="stats">


        <div class="stat">

            <div class="statTitle">
                Total Orders
            </div>

            <div
                id="totalOrders"
                class="statNumber">

                0

            </div>

        </div>


        <div class="stat">

            <div class="statTitle">
                Pending
            </div>

            <div
                id="pendingOrders"
                class="statNumber">

                0

            </div>

        </div>


        <div class="stat">

            <div class="statTitle">
                Packaging
            </div>

            <div
                id="packagingOrders"
                class="statNumber">

                0

            </div>

        </div>


        <div class="stat">

            <div class="statTitle">
                Delivered
            </div>

            <div
                id="deliveredOrders"
                class="statNumber">

                0

            </div>

        </div>


    </div>



    <!-- ================= TOOLBAR ================= -->

    <div class="toolbar">


        <input
            id="searchInput"
            type="search"
            placeholder="Search order, customer, phone...">


        <button
            id="refreshBtn"
            class="actionBtn">

            🔄 Refresh

        </button>


    </div>



    <!-- ================= ORDERS ================= -->

    <div
        id="ordersContainer"
        class="orders">

        <div class="empty">
            Loading orders...
        </div>

    </div>


</div>

</section>



<script>


/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://zsutkpsiefziotuwgkwq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_KfkaZZnDim3BlRxVUXd2wQ_WN84Duhb";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =====================================================
   ELEMENTS
   ===================================================== */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const adminPanel =
    document.getElementById(
        "adminPanel"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );



/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        errorMessage.textContent = "";


        const email =
            document
                .getElementById(
                    "adminEmail"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "adminPassword"
                )
                .value;


        const {
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email,
                    password

                });


        if(error){

            errorMessage.textContent =
                error.message ||
                "Login failed.";

            return;

        }


        showAdmin();

    }
);



/* =====================================================
   CHECK SESSION
   ===================================================== */

async function checkSession(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error){

        showLogin();

        return;

    }


    const session =
        data.session;


    if(session){

        showAdmin();

    }else{

        showLogin();

    }

}



/* =====================================================
   SHOW LOGIN
   ===================================================== */

function showLogin(){

    loginScreen
        .classList
        .remove("hidden");


    adminPanel
        .classList
        .add("hidden");

}



/* =====================================================
   SHOW ADMIN
   ===================================================== */

function showAdmin(){

    loginScreen
        .classList
        .add("hidden");


    adminPanel
        .classList
        .remove("hidden");


    loadOrders();

}



/* =====================================================
   LOGOUT
   ===================================================== */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async function(){

            await supabaseClient
                .auth
                .signOut();


            showLogin();

        }
    );



/* =====================================================
   LOAD ORDERS
   ===================================================== */

async function loadOrders(){

    ordersContainer.innerHTML =
        `
        <div class="empty">
            Loading orders...
        </div>
        `;


    /*
       STEP 1
       Get orders.
    */

    const {
        data:orders,
        error:ordersError
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(ordersError){

        console.error(
            "ORDERS ERROR:",
            ordersError
        );


        ordersContainer.innerHTML =
            `
            <div class="empty dbError">

                Unable to load orders.

                <br><br>

                ${escapeHtml(
                    ordersError.message
                )}

            </div>
            `;

        return;

    }


    const safeOrders =
        orders || [];


    if(!safeOrders.length){

        updateStats([]);

        renderOrders([]);

        return;

    }


    /*
       STEP 2
       Get customer IDs.
    */

    const customerIds =
        [
            ...new Set(
                safeOrders
                    .map(
                        order =>
                            order.customer_id
                    )
                    .filter(Boolean)
            )
        ];


    /*
       STEP 3
       Get customers.
    */

    let customers = [];


    if(customerIds.length){

        const {
            data,
            error
        } =
            await supabaseClient
                .from("customers")
                .select(
                    "id,name,phone,address"
                )
                .in(
                    "id",
                    customerIds
                );


        if(error){

            console.error(
                "CUSTOMERS ERROR:",
                error
            );

        }else{

            customers =
                data || [];

        }

    }


    /*
       STEP 4
       Map customers by ID.
    */

    const customerMap =
        new Map();


    customers.forEach(
        customer => {

            customerMap.set(
                String(customer.id),
                customer
            );

        }
    );



    /*
       STEP 5
       Get order IDs.
    */

    const orderIds =
        safeOrders
            .map(
                order =>
                    order.id
            )
            .filter(Boolean);



    /*
       STEP 6
       Get order items.
    */

    let orderItems = [];


    if(orderIds.length){

        const {
            data,
            error
        } =
            await supabaseClient
                .from("order_items")
                .select(`
                    id,
                    order_id,
                    product_id,
                    quantity,
                    price
                `)
                .in(
                    "order_id",
                    orderIds
                );


        if(error){

            console.error(
                "ORDER ITEMS ERROR:",
                error
            );

        }else{

            orderItems =
                data || [];

        }

    }



    /*
       STEP 7
       Get product IDs.
    */

    const productIds =
        [
            ...new Set(
                orderItems
                    .map(
                        item =>
                            item.product_id
                    )
                    .filter(Boolean)
            )
        ];



    /*
       STEP 8
       Get products.
    */

    let products = [];


    if(productIds.length){

        const {
            data,
            error
        } =
            await supabaseClient
                .from("products")
                .select(
                    "id,name,price"
                )
                .in(
                    "id",
                    productIds
                );


        if(error){

            console.error(
                "PRODUCTS ERROR:",
                error
            );

        }else{

            products =
                data || [];

        }

    }



    /*
       STEP 9
       Map products by ID.
    */

    const productMap =
        new Map();


    products.forEach(
        product => {

            productMap.set(
                String(product.id),
                product
            );

        }
    );



    /*
       STEP 10
       Attach customer + items
       to every order.
    */

    const finalOrders =
        safeOrders.map(
            order => {

                const customer =
                    customerMap.get(
                        String(
                            order.customer_id
                        )
                    ) || null;


                const items =
                    orderItems
                        .filter(
                            item =>
                                String(
                                    item.order_id
                                ) ===
                                String(
                                    order.id
                                )
                        )
                        .map(
                            item => {

                                const product =
                                    productMap.get(
                                        String(
                                            item.product_id
                                        )
                                    ) || null;


                                return {

                                    ...item,

                                    product

                                };

                            }
                        );


                return {

                    ...order,

                    customer,

                    items

                };

            }
        );



    updateStats(
        finalOrders
    );


    renderOrders(
        finalOrders
    );

}



/* =====================================================
   STATS
   ===================================================== */

function updateStats(
    orders
){

    document
        .getElementById(
            "totalOrders"
        )
        .textContent =
            orders.length;


    document
        .getElementById(
            "pendingOrders"
        )
        .textContent =
            orders.filter(
                order =>
                    normalizeStatus(
                        order.status
                    ) ===
                    "pending"
            ).length;


    document
        .getElementById(
            "packagingOrders"
        )
        .textContent =
            orders.filter(
                order =>
                    normalizeStatus(
                        order.status
                    ) ===
                    "packaging"
            ).length;


    document
        .getElementById(
            "deliveredOrders"
        )
        .textContent =
            orders.filter(
                order =>
                    normalizeStatus(
                        order.status
                    ) ===
                    "delivered"
            ).length;

}



/* =====================================================
   NORMALIZE STATUS
   ===================================================== */

function normalizeStatus(
    status
){

    if(!status)
        return "pending";


    return String(status)
        .toLowerCase()
        .replace(
            /\s+/g,
            ""
        )
        .replace(
            /_/g,
            ""
        );

}



/* =====================================================
   STATUS CLASS
   ===================================================== */

function statusClass(
    status
){

    const s =
        normalizeStatus(
            status
        );


    if(
        s === "packaging"
    )
        return "packaging";


    if(
        s === "ontheway" ||
        s === "shipping" ||
        s === "shipped"
    )
        return "ontheway";


    if(
        s === "delivered"
    )
        return "delivered";


    return "pending";

}



/* =====================================================
   STATUS TEXT
   ===================================================== */

function statusText(
    status
){

    const s =
        normalizeStatus(
            status
        );


    if(
        s === "packaging"
    )
        return "Packaging";


    if(
        s === "ontheway" ||
        s === "shipping" ||
        s === "shipped"
    )
        return "On the Way";


    if(
        s === "delivered"
    )
        return "Delivered";


    return "Pending";

}



/* =====================================================
   RENDER ORDERS
   ===================================================== */

function renderOrders(
    orders
){

    if(!orders.length){

        ordersContainer.innerHTML =
            `
            <div class="empty">
                No orders found.
            </div>
            `;

        return;

    }


    ordersContainer.innerHTML =
        orders
            .map(
                order =>
                    createOrderCard(
                        order
                    )
            )
            .join("");

}



/* =====================================================
   CREATE ORDER CARD
   ===================================================== */

function createOrderCard(
    order
){

    const customer =
        order.customer ||
        {};


    const orderNumber =
        order.order_number ||
        order.orderNumber ||
        order.id ||
        "Unknown";


    const customerName =
        customer.name ||
        order.name ||
        order.customer_name ||
        order.customerName ||
        "Not Provided";


    const phone =
        customer.phone ||
        order.phone ||
        order.customer_phone ||
        "Not Provided";


    const address =
        customer.address ||
        order.address ||
        order.customer_address ||
        "Not Provided";


    /*
       Current index.html does not save
       delivery into orders/customers.

       Therefore we do NOT invent a value.
    */

    const delivery =
        order.delivery ||
        order.delivery_method ||
        "Not Saved";


    const status =
        order.status ||
        "pending";


    const items =
        Array.isArray(
            order.items
        )
        ? order.items
        : [];


    const total =
        calculateOrderTotal(
            order,
            items
        );


    const date =
        order.created_at
        ? new Date(
            order.created_at
        ).toLocaleString(
            "en-PK"
        )
        : "Unknown";


    const searchText =
        (
            orderNumber +
            " " +
            customerName +
            " " +
            phone +
            " " +
            address
        ).toLowerCase();



    return `

    <div
        class="orderCard"
        data-search="${escapeHtml(
            searchText
        )}">


        <div class="orderTop">


            <div>

                <div class="orderNumber">

                    📦
                    ${escapeHtml(
                        orderNumber
                    )}

                </div>


                <div class="orderDate">

                    ${escapeHtml(
                        date
                    )}

                </div>

            </div>


            <div
                class="statusBadge ${statusClass(
                    status
                )}">

                ${statusText(
                    status
                )}

            </div>


        </div>



        <!-- CUSTOMER -->

        <div class="customerInfo">


            <div class="infoBox">

                <div class="infoLabel">
                    CUSTOMER
                </div>

                <div class="infoValue">

                    ${escapeHtml(
                        customerName
                    )}

                </div>

            </div>



            <div class="infoBox">

                <div class="infoLabel">
                    CONTACT
                </div>

                <div class="infoValue">

                    ${escapeHtml(
                        phone
                    )}

                </div>

            </div>



            <div class="infoBox">

                <div class="infoLabel">
                    ADDRESS
                </div>

                <div class="infoValue">

                    ${escapeHtml(
                        address
                    )}

                </div>

            </div>



            <div class="infoBox">

                <div class="infoLabel">
                    DELIVERY
                </div>

                <div class="infoValue">

                    ${escapeHtml(
                        delivery
                    )}

                </div>

            </div>


        </div>



        <!-- ITEMS -->

        <div class="orderItems">


            ${
                items.length

                ?

                items
                    .map(
                        item => {

                            const product =
                                item.product ||
                                {};


                            const name =
                                product.name ||
                                item.name ||
                                item.title ||
                                "Product";


                            const quantity =
                                Number(
                                    item.quantity ??
                                    item.qty ??
                                    1
                                );


                            const price =
                                Number(
                                    item.price ??
                                    product.price ??
                                    0
                                );


                            const lineTotal =
                                price *
                                quantity;


                            return `

                            <div
                                class="itemRow">


                                <div>

                                    <div
                                        class="itemName">

                                        ${escapeHtml(
                                            name
                                        )}

                                    </div>


                                    <div
                                        class="itemMeta">

                                        Qty:
                                        ${escapeHtml(
                                            quantity
                                        )}

                                        ×

                                        Rs.
                                        ${escapeHtml(
                                            formatMoney(
                                                price
                                            )
                                        )}

                                    </div>

                                </div>

/* =====================================================
   CALCULATE TOTAL
   ===================================================== */

function calculateOrderTotal(
    order,
    items
){

    const directTotal =
        order.total ??
        order.total_amount ??
        order.amount;


    if(
        directTotal !==
        undefined &&
        directTotal !==
        null &&
        directTotal !== ""
    ){

        const number =
            Number(
                directTotal
            );


        if(
            Number.isFinite(
                number
            )
        )
            return number;

    }


    return items.reduce(
        (
            sum,
            item
        ) => {

            const price =
                Number(
                    item.price ??
                    (
                        item.product &&
                        item.product.price
                    ) ??
                    0
                );


            const quantity =
                Number(
                    item.quantity ??
                    item.qty ??
                    1
                );


            return sum +
                (
                    price *
                    quantity
                );

        },
        0
    );

}



/* =====================================================
   CHANGE STATUS
   ===================================================== */

async function changeStatus(
    id,
    status
){

    if(!id)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                status:status

            })
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Status update failed:\n" +
            error.message
        );


        await loadOrders();

        return;

    }


    await loadOrders();

}



/* =====================================================
   GENERATE SLIP
   ===================================================== */

async function generateSlip(
    id
){

    if(!id)
        return;


    const {
        data:orders,
        error:orderError
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if(orderError){

        alert(
            "Unable to load order:\n" +
            orderError.message
        );

        return;

    }


    const order =
        orders;


    /*
       CUSTOMER
    */

    let customer = null;


    if(
        order.customer_id
    ){

        const {
            data,
            error
        } =
            await supabaseClient
                .from("customers")
                .select(
                    "id,name,phone,address"
                )
                .eq(
                    "id",
                    order.customer_id
                )
                .maybeSingle();


        if(!error)
            customer = data;

    }


    /*
       ORDER ITEMS
    */

    const {
        data:orderItems,
        error:itemsError
    } =
        await supabaseClient
            .from("order_items")
            .select(`
                id,
                order_id,
                product_id,
                quantity,
                price
            `)
            .eq(
                "order_id",
                id
            );


    if(itemsError){

        console.error(
            "SLIP ITEMS ERROR:",
            itemsError
        );

    }


    const items =
        orderItems || [];


    /*
       PRODUCTS
    */

    const productIds =
        [
            ...new Set(
                items
                    .map(
                        item =>
                            item.product_id
                    )
                    .filter(Boolean)
            )
        ];


    let products = [];


    if(productIds.length){

        const {
            data,
            error
        } =
            await supabaseClient
                .from("products")
                .select(
                    "id,name,price"
                )
                .in(
                    "id",
                    productIds
                );


        if(!error)
            products = data || [];

    }


    const productMap =
        new Map();


    products.forEach(
        product => {

            productMap.set(
                String(
                    product.id
                ),
                product
            );

        }
    );


    const finalItems =
        items.map(
            item => ({

                ...item,

                product:
                    productMap.get(
                        String(
                            item.product_id
                        )
                    ) || null

            })
        );


    createSlip({

        ...order,

        customer,

        items:
            finalItems

    });

}

/* =====================================================
   FORMAT MONEY
   ===================================================== */

function formatMoney(
    value
){

    const number =
        Number(
            value || 0
        );


    if(
        !Number.isFinite(
            number
        )
    )
        return "0";


    return number.toLocaleString(
        "en-PK"
    );

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   ESCAPE JS
   ===================================================== */

function escapeJs(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        '\\"'
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );

}
