<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://zsutkpsiefziotuwgkwq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_KfkaZZnDim3BlRxVUXd2wQ_WN84Duhb";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
document.getElementById("loginScreen");

const adminPanel =
document.getElementById("adminPanel");

const loginForm =
document.getElementById("loginForm");

const errorMessage =
document.getElementById("errorMessage");

const ordersContainer =

const productsContainer =
document.getElementById("productsContainer");

/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

errorMessage.textContent="";

const email =
document.getElementById("adminEmail")
.value.trim();

const password =
document.getElementById("adminPassword")
.value;

const {error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

errorMessage.textContent =
error.message || "Login failed.";

return;
}

showAdmin();

});


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

const {data,error} =
await supabaseClient.auth.getSession();

if(error){

showLogin();
return;

}

if(data.session){

showAdmin();

}else{

showLogin();

}

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

loginScreen.classList.remove("hidden");
adminPanel.classList.add("hidden");

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

loginScreen.classList.add("hidden");
adminPanel.classList.remove("hidden");

loadOrders();

}


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(){

await supabaseClient.auth.signOut();

showLogin();

});


/* =====================================================
   SECTIONS
===================================================== */

function showSection(section){

const ordersSection =
document.getElementById("ordersSection");

const productsSection =
document.getElementById("productsSection");

const ordersTab =
document.getElementById("ordersTab");

const productsTab =
document.getElementById("productsTab");

if(section==="orders"){

ordersSection.classList.remove("hidden");
productsSection.classList.add("hidden");

ordersTab.classList.add("active");
productsTab.classList.remove("active");

loadOrders();

}else{

ordersSection.classList.add("hidden");
productsSection.classList.remove("hidden");

ordersTab.classList.remove("active");
productsTab.classList.add("active");

loadProducts();

}

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

ordersContainer.innerHTML =
`<div class="empty">Loading orders...</div>`;

const {
data:orders,
error:ordersError
} =
await supabaseClient
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(ordersError){

ordersContainer.innerHTML =
`
<div class="empty dbError">
Unable to load orders.<br><br>
${escapeHtml(ordersError.message)}
</div>
`;

return;

}

const safeOrders=orders||[];

if(!safeOrders.length){

updateStats([]);

renderOrders([]);

return;

}


/* CUSTOMERS */

const customerIds=[
...new Set(
safeOrders
.map(order=>order.customer_id)
.filter(Boolean)
)
];

let customers=[];

if(customerIds.length){

const {data,error} =
await supabaseClient
.from("customers")
.select("id,name,phone,address")
.in("id",customerIds);

if(!error)
customers=data||[];

}

const customerMap=new Map();

customers.forEach(customer=>{
customerMap.set(String(customer.id),customer);
});


/* ITEMS */

const orderIds=
safeOrders
.map(order=>order.id)
.filter(Boolean);

let orderItems=[];

if(orderIds.length){

const {data,error} =
await supabaseClient
.from("order_items")
.select(`
id,
order_id,
product_id,
quantity,
price
`)
.in("order_id",orderIds);

if(!error)
orderItems=data||[];

}


/* PRODUCTS */

const productIds=[
...new Set(
orderItems
.map(item=>item.product_id)
.filter(Boolean)
)
];

let products=[];

if(productIds.length){

const {data,error} =
await supabaseClient
.from("products")
.select("id,name,price")
.in("id",productIds);

if(!error)
products=data||[];

}

const productMap=new Map();

products.forEach(product=>{
productMap.set(
String(product.id),
product
);
});


/* FINAL */

const finalOrders=
safeOrders.map(order=>{

const customer=
customerMap.get(
String(order.customer_id)
)||null;

const items=
orderItems
.filter(
item =>
String(item.order_id)===
String(order.id)
)
.map(item=>({

...item,

product:
productMap.get(
String(item.product_id)
)||null

}));

return {
...order,
customer,
items
};

});


updateStats(finalOrders);
renderOrders(finalOrders);

}


/* =====================================================
   STATS
===================================================== */

function updateStats(orders){

document.getElementById("totalOrders")
.textContent=orders.length;

document.getElementById("pendingOrders")
.textContent=
orders.filter(
order=>normalizeStatus(order.status)==="pending"
).length;

document.getElementById("packagingOrders")
.textContent=
orders.filter(
order=>normalizeStatus(order.status)==="packaging"
).length;

document.getElementById("deliveredOrders")
.textContent=
orders.filter(
order=>normalizeStatus(order.status)==="delivered"
).length;

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status){

if(!status)return"pending";

return String(status)
.toLowerCase()
.replace(/\s+/g,"")
.replace(/_/g,"");

}


function statusClass(status){

const s=normalizeStatus(status);

if(s==="packaging")return"packaging";

if(
s==="ontheway"||
s==="shipping"||
s==="shipped"
)return"ontheway";

if(s==="delivered")return"delivered";

return"pending";

}


function statusText(status){

const s=normalizeStatus(status);

if(s==="packaging")return"Packaging";

if(
s==="ontheway"||
s==="shipping"||
s==="shipped"
)return"On the Way";

if(s==="delivered")return"Delivered";

return"Pending";

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders){

if(!orders.length){

ordersContainer.innerHTML=
`<div class="empty">No orders found.</div>`;

return;

}

ordersContainer.innerHTML=
orders.map(createOrderCard).join("");

}


/* =====================================================
   ORDER CARD
===================================================== */

function createOrderCard(order){

const customer=order.customer||{};

const orderNumber=
order.order_number||
order.orderNumber||
order.id||
"Unknown";

const customerName=
customer.name||
order.name||
order.customer_name||
"Not Provided";

const phone=
customer.phone||
order.phone||
order.customer_phone||
"Not Provided";

const address=
customer.address||
order.address||
order.customer_address||
"Not Provided";

const delivery=
order.delivery||
order.delivery_method||
"Not Saved";

const status=
order.status||"pending";

const items=
Array.isArray(order.items)?
order.items:[];

const total=
calculateOrderTotal(order,items);

const date=
order.created_at
?new Date(order.created_at)
.toLocaleString("en-PK")
:"Unknown";

const searchText=
(
orderNumber+" "+
customerName+" "+
phone+" "+
address
).toLowerCase();


return `

<div
class="orderCard"
data-search="${escapeHtml(searchText)}">

<div class="orderTop">

<div>

<div class="orderNumber">
📦 ${escapeHtml(orderNumber)}
</div>

<div class="orderDate">
${escapeHtml(date)}
</div>

</div>

<div class="statusBadge ${statusClass(status)}">
${statusText(status)}
</div>

</div>


<div class="customerInfo">

<div class="infoBox">
<div class="infoLabel">CUSTOMER</div>
<div class="infoValue">
${escapeHtml(customerName)}
</div>
</div>

<div class="infoBox">
<div class="infoLabel">CONTACT</div>
<div class="infoValue">
${escapeHtml(phone)}
</div>
</div>

<div class="infoBox">
<div class="infoLabel">ADDRESS</div>
<div class="infoValue">
${escapeHtml(address)}
</div>
</div>

<div class="infoBox">
<div class="infoLabel">DELIVERY</div>
<div class="infoValue">
${escapeHtml(delivery)}
</div>
</div>

</div>


<div class="orderItems">

${
items.length

?

items.map(item=>{

const product=item.product||{};

const name=
product.name||
item.name||
item.title||
"Product";

const quantity=
Number(
item.quantity??
item.qty??
1
);

const price=
Number(
item.price??
product.price??
0
);

const lineTotal=
price*quantity;

return `

<div class="itemRow">

<div>

<div class="itemName">
${escapeHtml(name)}
</div>

<div class="itemMeta">
Qty: ${quantity}
× Rs. ${formatMoney(price)}
</div>

</div>

<div>
Rs. ${formatMoney(lineTotal)}
</div>

</div>

`;

}).join("")

:

`
<div class="itemRow">
<span>No item details available</span>
</div>
`

}

</div>


<div class="orderBottom">

<div class="total">
Rs. ${formatMoney(total)}
</div>


<select
class="statusSelect"

/* =====================================================
   TOTAL
===================================================== */

function calculateOrderTotal(order,items){

const directTotal=
order.total??
order.total_amount??
order.amount;

if(
directTotal!==undefined&&
directTotal!==null&&
directTotal!==""
){

const number=Number(directTotal);

if(Number.isFinite(number))
return number;

}

return items.reduce(
(sum,item)=>{

const price=
Number(
item.price??
(
item.product&&item.product.price
)??
0
);

const quantity=
Number(
item.quantity??
item.qty??
1
);

return sum+(price*quantity);

},
0
);

}

===================================================== */

async function generateSlip(id){

if(!id)return;

const {
data:order,
error:orderError
}=
await supabaseClient
.from("orders")
.select("*")
.eq("id",id)
.single();

if(orderError){

alert(
"Unable to load order:\n"+
orderError.message
);

return;

}

let customer=null;

if(order.customer_id){

const {data,error}=
await supabaseClient
.from("customers")
.select("id,name,phone,address")
.eq("id",order.customer_id)
.maybeSingle();

if(!error)
customer=data;

}

const {
data:orderItems
}=
await supabaseClient
.from("order_items")
.select(`
id,
order_id,
product_id,
quantity,
price
`)
.eq("order_id",id);

const items=orderItems||[];

const productIds=[
...new Set(
items
.map(item=>item.product_id)
.filter(Boolean)
)
];

let products=[];

if(productIds.length){

const {data}=
await supabaseClient
.from("products")
.select("id,name,price")
.in("id",productIds);

products=data||[];

}

const productMap=new Map();

products.forEach(product=>{
productMap.set(
String(product.id),
product
);
});

const finalItems=
items.map(item=>({

...item,

product:
productMap.get(
String(item.product_id)
)||null

}));

createSlip({

...order,

customer,

items:finalItems

});

}

/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(value){

const number=Number(value||0);

if(!Number.isFinite(number))
return "0";

return number.toLocaleString("en-PK");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}
